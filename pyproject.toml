[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmp-mcp"
dynamic = ["version"]
description = "MCP server for Financial Modeling Prep market data"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "pandas>=3.0,<4",
    "pyarrow>=23.0,<24",
    "python-dotenv>=1.0,<2",
    "fastmcp>=3.1,<4",
    "zstandard>=0.23,<1",
    "cachetools>=5,<8",
    "value-semantics-core>=2.1,<3",
]

[project.optional-dependencies]
estimates = ["psycopg2-binary"]

[project.scripts]
fmp-mcp = "fmp.server:main"

[tool.hatch.version]
path = "fmp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fmp"]

[tool.hatch.build.targets.sdist]
include = ["fmp/", "pyproject.toml", "README.md", "LICENSE"]
